<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); position: relative; }
  body[data-mode="brb"] { background: rgba(11, 12, 15, .55); }
  body[data-mode="bg"] main, body[data-mode="bg"] footer { display: none; }
  .glow { position: absolute; inset: -200px; background: radial-gradient(900px 600px at 25% 35%, rgba(200, 255, 46, .08), transparent 70%); animation: drift 30s ease-in-out infinite alternate; }
  body[data-mode="privacy"] .glow { display: none; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(160px, 80px); } }
  main { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); max-width: 1100px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .eyebrow.live .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 { margin: 20px 0 0; font-size: 128px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
  .clock { margin-top: 28px; font-size: 72px; font-weight: 600; color: var(--accent); }
  .sub { margin-top: 24px; font-size: 32px; font-weight: 500; color: var(--text-2); }
  footer { position: absolute; left: 120px; bottom: 96px; font-size: 26px; font-weight: 600; transition: opacity .4s; }
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="eyebrow" id="eyebrow"><span class="dot"></span><span id="eyebrow-text"></span></div>
  <h1 id="title"></h1>
  <div class="clock" id="clock" hidden></div>
  <div class="sub" id="sub"></div>
</main>
<footer id="footer"></footer>
<script src="config.js"></script>
<script src="lib/kit-lib.js"></script>
<script>
  var kit = window.KIT || { display_name: "Streamer", socials: [], starting_minutes: 5 };
  var mode = KitLib.normalizeMode(document.body.dataset.mode);
  var COPY = {
    starting: { eyebrow: "Starting soon", title: kit.display_name, sub: "Grab a drink. We go live in a moment." },
    brb:      { eyebrow: "Be right back", title: "One sec.", sub: "Don't go anywhere." },
    ending:   { eyebrow: "Stream ended", title: "GGs.", sub: "Thanks for hanging out. See you next stream." },
    privacy:  { eyebrow: "Paused", title: "Back in a moment.", sub: "" },
    bg:       { eyebrow: "", title: "", sub: "" }
  };
  var c = COPY[mode];
  document.getElementById("eyebrow-text").textContent = c.eyebrow;
  document.getElementById("eyebrow").classList.toggle("live", mode === "starting");
  document.getElementById("title").textContent = c.title;
  document.getElementById("sub").textContent = c.sub;
  var clock = document.getElementById("clock");
  var footer = document.getElementById("footer");
  var startedAt = Date.now();
  var durationMs = (kit.starting_minutes || 5) * 60000;
  function tick() {
    var now = Date.now();
    if (mode === "starting") {
      clock.hidden = false;
      var left = KitLib.remainingMs(startedAt, durationMs, now);
      clock.textContent = left > 0 ? KitLib.formatClock(left) : "Starting now";
    }
    var socials = kit.socials || [];
    var i = KitLib.rotateIndex(socials.length, now, 8000);
    footer.textContent = (i >= 0 && mode !== "privacy") ? socials[i] : "";
  }
  tick();
  setInterval(tick, 250);
</script>
</body>
</html>
